<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Guru & PTY - TK ABA Karangmojo XXI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6',
                            600: '#0d9488', 700: '#0f766e', 800: '#115e59', 900: '#134e4a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; color: black !important; }
            .shadow-lg, .shadow-md, .shadow-sm { box-shadow: none !important; }
            .border { border-color: #cbd5e1 !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased">

    <!-- Header Section -->
    <header class="bg-gradient-to-r from-teal-700 via-teal-600 to-emerald-600 text-white shadow-lg no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <div class="bg-white/20 p-3 rounded-2xl backdrop-blur-md border border-white/30 text-white">
                        <i class="fa-solid font-bold fa-school-flag text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-bold tracking-tight">TK ABA Karangmojo XXI</h1>
                        <p class="text-teal-100 text-xs sm:text-sm font-medium flex items-center gap-2">
                            <span>Sistem Absensi Guru & PTY</span>
                            <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-300"></span>
                            <span id="current-day-badge" class="bg-white/10 px-2 py-0.5 rounded text-xs">--</span>
                        </p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="switchTab('input')" id="tab-btn-input" class="px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 bg-white text-teal-800 shadow-sm flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square"></i> Input Absensi
                    </button>
                    <button onclick="switchTab('rekap')" id="tab-btn-rekap" class="px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 bg-teal-800/60 hover:bg-white/20 text-white border border-white/20 flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie"></i> Rekap & Laporan
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Header khusus saat Cetak -->
    <div class="print-only p-6 border-b border-slate-300 text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-900">TK ABA KARANGMOJO XXI</h1>
        <p class="text-slate-600 text-sm">Laporan Rekapitulasi Kehadiran Guru & PTY</p>
        <p id="print-date-range" class="text-slate-500 text-xs mt-1"></p>
    </div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">

        <!-- TAB 1: INPUT ABSENSI -->
        <section id="section-input" class="space-y-6">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="space-y-1">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-calendar-check text-teal-600"></i> Form Presensi Harian
                    </h2>
                    <p class="text-xs text-slate-500">Pilih tanggal dan tentukan status kehadiran seluruh staf.</p>
                </div>

                <div class="flex flex-wrap items-center gap-3">
                    <div class="relative">
                        <label for="input-date" class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-0.5">Tanggal Presensi</label>
                        <input type="date" id="input-date" onchange="onDateChange()" class="bg-slate-50 border border-slate-30
